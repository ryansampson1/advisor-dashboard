<!DOCTYPE html>
<html lang="en">
<head>
<!-- ============================================================================
     ESHENBAUGH LAND COMPANY — PUBLIC LISTING WEBSITE (buyer-facing)
     marker: LISTING-20260821
     One page per published listing. Loads a single Firestore doc from the
     `listings` collection by the id in the URL hash (e.g. #Willow_Creek_Ranch).
     Security: rules allow a public single-doc `get` when you know the exact id
     (same model as the proposals viewer) — the collection cannot be listed.
     Advisors publish/edit these from the Terra dashboard deal card (🌐 button).
     ============================================================================ -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Land For Sale · Eshenbaugh Land Company</title>
<style>
  :root{
    --teal:#00b2a9;   /* PANTONE 326 C */
    --red:#da291c;    /* PANTONE 485 C */
    --dark:#121417;
    --light:#f4f6f8;
    --ink:#1c2126;
    --muted:#5b6570;
    --line:#e3e8ec;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--light);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  img{max-width:100%;display:block}
  a{color:var(--teal)}

  /* ---- header ---- */
  .hd{background:var(--dark);color:#fff;position:sticky;top:0;z-index:50;
      display:flex;align-items:center;justify-content:space-between;gap:1rem;
      padding:.65rem clamp(1rem,4vw,2.5rem);box-shadow:0 2px 12px rgba(0,0,0,.25)}
  .hd .brand{display:flex;align-items:center;gap:.75rem;min-width:0}
  .hd img{height:38px;width:auto}
  .hd .co{font-weight:800;letter-spacing:.04em;font-size:.95rem;white-space:nowrap}
  .hd .tag{font-size:.72rem;color:#9aa4ae;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
  .hd .call{background:var(--red);color:#fff;text-decoration:none;font-weight:700;font-size:.85rem;
      padding:.55rem 1rem;border-radius:999px;white-space:nowrap;min-height:44px;display:inline-flex;align-items:center}
  .hd .call:hover{filter:brightness(1.1)}
  @media(max-width:560px){ .hd .co,.hd .tag{display:none} }

  /* ---- hero ---- */
  .hero{position:relative;background:var(--dark);color:#fff;min-height:min(58vh,520px);
        display:flex;align-items:flex-end;overflow:hidden}
  .hero .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.82)}
  .hero .bg.noimg{background:linear-gradient(135deg,#17323a,#0b1d22 60%,#121417)}
  .hero .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,12,14,.85) 0%,rgba(10,12,14,.25) 45%,transparent 70%)}
  .hero .inner{position:relative;width:100%;max-width:1080px;margin:0 auto;padding:5rem clamp(1rem,4vw,2.5rem) 1.9rem}
  .status{display:inline-flex;align-items:center;gap:.45rem;font-size:.75rem;font-weight:800;letter-spacing:.12em;
          text-transform:uppercase;padding:.35rem .85rem;border-radius:999px;margin-bottom:.9rem}
  .status .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
  .status.available{background:rgba(0,178,169,.18);color:#3be3d9;border:1px solid rgba(0,178,169,.55)}
  .status.under_contract{background:rgba(255,171,0,.16);color:#ffc94d;border:1px solid rgba(255,171,0,.5)}
  .status.sold{background:rgba(218,41,28,.2);color:#ff8a80;border:1px solid rgba(218,41,28,.6)}
  .status.off_market{background:rgba(255,255,255,.12);color:#cfd6dc;border:1px solid rgba(255,255,255,.3)}
  .hero h1{font-size:clamp(1.6rem,4.4vw,2.9rem);font-weight:800;line-height:1.12;text-shadow:0 2px 14px rgba(0,0,0,.45)}
  .hero .addr{font-size:clamp(.95rem,2.2vw,1.15rem);color:#dbe2e8;margin-top:.45rem;text-shadow:0 1px 8px rgba(0,0,0,.5)}
  .hero .price{font-size:clamp(1.25rem,3.2vw,1.9rem);font-weight:800;color:#fff;margin-top:.85rem}
  .hero .price small{font-size:.62em;font-weight:600;color:#c3cbd2}

  /* ---- facts strip ---- */
  .facts{background:#fff;border-bottom:1px solid var(--line)}
  .facts .inner{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;
                padding:.4rem clamp(1rem,4vw,2.5rem)}
  .fact{flex:1 1 130px;min-width:120px;padding:.85rem 1rem .8rem 0}
  .fact .k{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .fact .v{font-size:1.05rem;font-weight:800;color:var(--ink);margin-top:.1rem}

  /* ---- layout ---- */
  main{max-width:1080px;margin:0 auto;padding:1.6rem clamp(1rem,4vw,2.5rem) 3rem}
  section{margin-top:2.2rem}
  h2{font-size:1.15rem;font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:.5rem;margin-bottom:.9rem}
  h2::after{content:"";flex:1;height:2px;background:linear-gradient(to right,var(--teal),transparent);opacity:.35;border-radius:2px}
  .desc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:1.35rem 1.5rem;
        font-size:1rem;color:#2a323a;white-space:pre-line;box-shadow:0 1px 4px rgba(16,24,32,.04)}
  ul.hl{list-style:none;margin-top:1rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.55rem .9rem}
  ul.hl li{background:#fff;border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:10px;
           padding:.65rem .9rem;font-size:.93rem;font-weight:500}

  /* ---- gallery ---- */
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.75rem}
  .gal figure{position:relative;border-radius:12px;overflow:hidden;cursor:zoom-in;background:#dfe5ea;aspect-ratio:4/3}
  .gal img{width:100%;height:100%;object-fit:cover;transition:transform .25s}
  .gal figure:hover img{transform:scale(1.04)}
  .gal figcaption{position:absolute;left:0;right:0;bottom:0;padding:.4rem .6rem;font-size:.72rem;color:#fff;
                  background:linear-gradient(transparent,rgba(0,0,0,.65))}
  .lb{position:fixed;inset:0;background:rgba(8,10,12,.93);z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column;padding:2rem}
  .lb.open{display:flex}
  .lb img{max-width:94vw;max-height:82vh;object-fit:contain;border-radius:8px}
  .lb .cap{color:#cfd6dc;font-size:.85rem;margin-top:.7rem}
  .lb .x{position:absolute;top:.9rem;right:1.1rem;background:none;border:none;color:#fff;font-size:2rem;cursor:pointer;line-height:1;padding:.4rem}
  .lb .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);border:none;color:#fff;
           font-size:1.6rem;width:46px;height:46px;border-radius:50%;cursor:pointer}
  .lb .nav:hover{background:rgba(255,255,255,.25)}
  .lb .prev{left:.9rem}.lb .next{right:.9rem}

  /* ---- documents ---- */
  .docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.75rem}
  .doc{display:flex;align-items:center;gap:.85rem;background:#fff;border:1px solid var(--line);border-radius:12px;
       padding:.85rem 1rem;text-decoration:none;color:var(--ink);min-height:44px;
       transition:box-shadow .15s,border-color .15s;box-shadow:0 1px 4px rgba(16,24,32,.04)}
  .doc:hover{border-color:var(--teal);box-shadow:0 3px 12px rgba(0,178,169,.15)}
  .doc .ic{font-size:1.45rem;flex:0 0 auto}
  .doc .t{font-weight:700;font-size:.92rem;line-height:1.25}
  .doc .c{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-top:.1rem}

  /* ---- map ---- */
  .mapwrap{border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:0 1px 4px rgba(16,24,32,.06)}
  .mapwrap iframe{width:100%;height:380px;border:0;display:block}
  .maplink{display:inline-flex;align-items:center;gap:.4rem;margin-top:.6rem;font-weight:600;font-size:.9rem;min-height:44px}

  /* ---- advisors ---- */
  .advs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;max-width:760px}
  .adv{background:#fff;border:1px solid var(--line);border-radius:14px;padding:1.25rem 1.35rem;box-shadow:0 1px 4px rgba(16,24,32,.04)}
  .adv .top{display:flex;align-items:center;gap:.9rem}
  .adv .av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--teal),#007a74);
           color:#fff;font-weight:800;font-size:1.25rem;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .adv .nm{font-weight:800;font-size:1.05rem}
  .adv .ti{font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  .adv .ct{margin-top:.85rem;display:flex;flex-direction:column;gap:.35rem}
  .adv .ct a{display:inline-flex;align-items:center;gap:.5rem;color:var(--ink);text-decoration:none;font-weight:600;
             font-size:.93rem;min-height:44px;padding:.15rem 0}
  .adv .ct a:hover{color:var(--teal)}
  .adv details{margin-top:.6rem}
  .adv summary{cursor:pointer;font-size:.82rem;font-weight:700;color:var(--teal);min-height:44px;display:flex;align-items:center}
  .adv details p{font-size:.86rem;color:#3a434c;margin-top:.4rem;white-space:pre-line}

  /* ---- CTA band ---- */
  .cta{margin-top:2.6rem;background:var(--dark);border-radius:16px;color:#fff;text-align:center;
       padding:2.2rem 1.5rem}
  .cta h3{font-size:1.35rem;font-weight:800}
  .cta p{color:#aeb7bf;margin-top:.35rem;font-size:.95rem}
  .cta .btns{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin-top:1.2rem}
  .cta a{display:inline-flex;align-items:center;gap:.45rem;text-decoration:none;font-weight:700;font-size:.95rem;
         padding:.7rem 1.5rem;border-radius:999px;min-height:44px}
  .cta a.red{background:var(--red);color:#fff}
  .cta a.ghost{border:1.5px solid rgba(255,255,255,.4);color:#fff}
  .cta a:hover{filter:brightness(1.12)}

  /* ---- footer ---- */
  footer{background:var(--dark);color:#8c959e;margin-top:3rem;padding:2rem clamp(1rem,4vw,2.5rem);font-size:.8rem}
  footer .inner{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;gap:1.5rem;justify-content:space-between;align-items:center}
  footer a{color:#c3cbd2;text-decoration:none}
  footer .disc{max-width:1080px;margin:1.2rem auto 0;font-size:.7rem;color:#5f6870;line-height:1.5}

  /* ---- states ---- */
  .state{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem}
  .state .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:2.5rem 2.8rem;max-width:440px;box-shadow:0 4px 24px rgba(16,24,32,.08)}
  .state .big{font-size:2.4rem}
  .state h2{justify-content:center}.state h2::after{display:none}
  .state p{color:var(--muted);margin-top:.5rem;font-size:.93rem}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;
        animation:sp 1s linear infinite;margin:0 auto 1rem}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* subtle focus rings for keyboard users */
  a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}

  @media print{ .hd .call,.cta,.lb{display:none!important} .hero{min-height:300px} }
</style>
</head>
<body>

<header class="hd">
  <div class="brand">
    <img src="../proposals/assets/logo-light.png" alt="Eshenbaugh Land Company" onerror="this.remove()">
    <div>
      <div class="co">Eshenbaugh Land Company</div>
      <div class="tag">The Dirt Dog · Florida Land Brokers</div>
    </div>
  </div>
  <a class="call" id="hd-call" href="tel:18132878787">📞 (813) 287-8787</a>
</header>

<div id="app">
  <div class="state"><div class="card"><div class="spin"></div><h2>Loading listing…</h2></div></div>
</div>

<div class="lb" id="lb" role="dialog" aria-label="Photo viewer">
  <button class="x" onclick="lbClose()" aria-label="Close">×</button>
  <button class="nav prev" onclick="lbStep(-1)" aria-label="Previous photo">‹</button>
  <img id="lb-img" src="" alt="">
  <div class="cap" id="lb-cap"></div>
  <button class="nav next" onclick="lbStep(1)" aria-label="Next photo">›</button>
</div>

<script>
(function(){
  "use strict";

  var FB_CONFIG = {
    apiKey:"AIzaSyC1cKWQnk4TeH3EMeX-sF4RejGPYL9xyYw",
    authDomain:"eshenbaugh-dashboard.firebaseapp.com",
    projectId:"eshenbaugh-dashboard",
    storageBucket:"eshenbaugh-dashboard.firebasestorage.app",
    messagingSenderId:"458253707783",
    appId:"1:458253707783:web:8c86e4bfd2a371ae67d8a2"
  };

  var COMPANY = {
    phone:"(813) 287-8787", phoneRaw:"18132878787",
    address:"304 S. Willow Avenue, Tampa, Florida 33606",
    website:"www.DirtDog.com", websiteUrl:"https://www.thedirtdog.com"
  };

  var STATUS = {
    available:      {label:"Available",      cls:"available"},
    under_contract: {label:"Under Contract", cls:"under_contract"},
    sold:           {label:"Sold",           cls:"sold"},
    off_market:     {label:"Off Market",     cls:"off_market"}
  };

  var DOC_ICONS = {
    aerial:"🛩️", map:"🗺️", siteplan:"📐", demographics:"📊", survey:"📏",
    flyer:"📄", zoning:"🏛️", environmental:"🌿", other:"📁"
  };
  var DOC_LABELS = {
    aerial:"Aerial", map:"Map", siteplan:"Site Plan", demographics:"Demographics",
    survey:"Survey", flyer:"Flyer / Brochure", zoning:"Zoning", environmental:"Environmental", other:"Document"
  };

  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
  function money(n){ n=Number(n); return isFinite(n)&&n>0 ? "$"+Math.round(n).toLocaleString("en-US") : ""; }
  function telHref(p){ var d=String(p||"").replace(/\D/g,""); if(d.length===10) d="1"+d; return d?("tel:"+d):""; }
  function initials(name){ return String(name||"").trim().split(/\s+/).slice(0,2).map(function(w){return w.charAt(0).toUpperCase();}).join("")||"E"; }

  function showState(emoji, title, sub){
    document.getElementById("app").innerHTML =
      '<div class="state"><div class="card"><div class="big">'+emoji+'</div><h2>'+esc(title)+'</h2><p>'+esc(sub)+'</p>'+
      '<p style="margin-top:1rem"><a href="'+COMPANY.websiteUrl+'">Visit '+COMPANY.website+'</a> · <a href="'+telHref(COMPANY.phone)+'">'+COMPANY.phone+'</a></p></div></div>';
  }

  /* ---- lightbox ---- */
  var _photos=[], _lbIdx=0;
  window.lbOpen=function(i){ _lbIdx=i; lbShow(); document.getElementById("lb").classList.add("open"); document.body.style.overflow="hidden"; };
  window.lbClose=function(){ document.getElementById("lb").classList.remove("open"); document.body.style.overflow=""; };
  window.lbStep=function(d){ if(!_photos.length) return; _lbIdx=(_lbIdx+d+_photos.length)%_photos.length; lbShow(); };
  function lbShow(){ var p=_photos[_lbIdx]||{}; document.getElementById("lb-img").src=p.url||""; document.getElementById("lb-cap").textContent=p.caption||""; }
  document.addEventListener("keydown",function(e){
    if(!document.getElementById("lb").classList.contains("open")) return;
    if(e.key==="Escape") lbClose();
    if(e.key==="ArrowLeft") lbStep(-1);
    if(e.key==="ArrowRight") lbStep(1);
  });
  document.getElementById("lb").addEventListener("click",function(e){ if(e.target===this) lbClose(); });

  /* ---- render ---- */
  function render(L){
    document.title = (L.headline||L.address||"Land For Sale")+" · Eshenbaugh Land Company";

    var st = STATUS[L.status] || STATUS.available;
    var priceStr = (L.priceText||"").trim() || money(L.price) || "Call for Pricing";
    var acres = parseFloat(L.acreage);
    var ppa = (isFinite(acres)&&acres>0&&Number(L.price)>0) ? money(Number(L.price)/acres)+"/acre" : "";

    var facts = [];
    if(priceStr) facts.push(["Price", priceStr]);
    if(L.acreage) facts.push(["Acreage", esc(L.acreage)+(String(L.acreage).match(/ac/i)?"":" ± AC")]);
    if(ppa && L.status!=="sold") facts.push(["Price / Acre", ppa]);
    if(L.zoning) facts.push(["Zoning", esc(L.zoning)]);
    if(L.county) facts.push(["County", esc(L.county)+" County, FL"]);
    if(L.parcelId) facts.push(["Parcel ID", esc(L.parcelId)]);

    var highlights = (L.highlights||[]).filter(function(h){return String(h||"").trim();});
    _photos = (L.gallery||[]).filter(function(p){return p&&p.url;});
    var docs = (L.docs||[]).filter(function(d){return d&&d.url;});
    var advisors = (L.advisors||[]).filter(function(a){return a&&a.name;});

    var mapQ = (L.mapQuery||L.address||"").trim();

    var html = "";

    /* hero */
    html += '<div class="hero">'
      + '<div class="bg'+(L.heroPhoto?'':' noimg')+'"'+(L.heroPhoto?' style="background-image:url(\''+esc(L.heroPhoto)+'\')"':'')+'></div>'
      + '<div class="shade"></div><div class="inner">'
      + '<span class="status '+st.cls+'"><span class="dot"></span>'+st.label+'</span>'
      + '<h1>'+esc(L.headline||L.address||"Land Opportunity")+'</h1>'
      + (L.address && L.headline ? '<div class="addr">📍 '+esc(L.address)+(L.county?' · '+esc(L.county)+' County, FL':'')+'</div>'
         : (L.county?'<div class="addr">📍 '+esc(L.county)+' County, Florida</div>':''))
      + '<div class="price">'+esc(priceStr)+(ppa&&L.status!=="sold"?' <small>('+ppa+')</small>':'')+'</div>'
      + '</div></div>';

    /* facts */
    if(facts.length){
      html += '<div class="facts"><div class="inner">'+facts.map(function(f){
        return '<div class="fact"><div class="k">'+f[0]+'</div><div class="v">'+f[1]+'</div></div>';
      }).join("")+'</div></div>';
    }

    html += '<main>';

    /* description + highlights */
    if(L.description || highlights.length){
      html += '<section><h2>🏞️ Property Overview</h2>';
      if(L.description) html += '<div class="desc">'+esc(L.description)+'</div>';
      if(highlights.length) html += '<ul class="hl">'+highlights.map(function(h){return '<li>✔ '+esc(h)+'</li>';}).join("")+'</ul>';
      html += '</section>';
    }

    /* gallery */
    if(_photos.length){
      html += '<section><h2>📸 Photos</h2><div class="gal">'+_photos.map(function(p,i){
        return '<figure onclick="lbOpen('+i+')" tabindex="0" onkeydown="if(event.key===\'Enter\')lbOpen('+i+')">'
          + '<img src="'+esc(p.url)+'" alt="'+esc(p.caption||"Property photo")+'" loading="lazy">'
          + (p.caption?'<figcaption>'+esc(p.caption)+'</figcaption>':'')+'</figure>';
      }).join("")+'</div></section>';
    }

    /* documents */
    if(docs.length){
      html += '<section><h2>📂 Property Information</h2><div class="docs">'+docs.map(function(d){
        var cat=(d.category||"other").toLowerCase();
        return '<a class="doc" href="'+esc(d.url)+'" target="_blank" rel="noopener">'
          + '<span class="ic">'+(DOC_ICONS[cat]||DOC_ICONS.other)+'</span>'
          + '<span><span class="t">'+esc(d.label||d.name||"Document")+'</span>'
          + '<div class="c">'+esc(DOC_LABELS[cat]||"Document")+'</div></span></a>';
      }).join("")+'</div></section>';
    }

    /* map */
    if(mapQ){
      html += '<section><h2>📍 Location</h2><div class="mapwrap">'
        + '<iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q='+encodeURIComponent(mapQ)+'&output=embed" title="Map of '+esc(mapQ)+'"></iframe></div>'
        + '<a class="maplink" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(mapQ)+'" target="_blank" rel="noopener">Open in Google Maps ↗</a></section>';
    }

    /* advisors */
    if(advisors.length){
      html += '<section><h2>🤝 Your Land Advisor'+(advisors.length>1?'s':'')+'</h2><div class="advs">'+advisors.map(function(a){
        return '<div class="adv"><div class="top"><div class="av">'+esc(initials(a.name))+'</div>'
          + '<div><div class="nm">'+esc(a.name)+'</div><div class="ti">'+esc(a.title||"Land Advisor")+' · Eshenbaugh Land Company</div></div></div>'
          + '<div class="ct">'
          + (a.phone?'<a href="'+telHref(a.phone)+'">📞 '+esc(a.phone)+'</a>':'')
          + (a.email?'<a href="mailto:'+esc(a.email)+'?subject='+encodeURIComponent("Inquiry: "+(L.address||L.headline||"Listing"))+'">✉️ '+esc(a.email)+'</a>':'')
          + '</div>'
          + (a.bio?'<details><summary>About '+esc((a.name||"").split(" ")[0])+'</summary><p>'+esc(a.bio)+'</p></details>':'')
          + '</div>';
      }).join("")+'</div></section>';
    }

    /* CTA */
    var lead = advisors[0]||{};
    html += '<div class="cta"><h3>'+(L.status==="sold"?"Looking for land like this?":"Interested in this property?")+'</h3>'
      + '<p>'+(L.status==="sold"
          ? "This one is sold — but we know Florida dirt. Reach out and we'll help you find the next one."
          : "Call or email "+esc(lead.name||"our team")+" for pricing details, due diligence materials, or to schedule a site visit.")+'</p>'
      + '<div class="btns">'
      + (lead.phone?'<a class="red" href="'+telHref(lead.phone)+'">📞 Call '+esc((lead.name||"us").split(" ")[0])+'</a>':'<a class="red" href="'+telHref(COMPANY.phone)+'">📞 Call '+COMPANY.phone+'</a>')
      + (lead.email?'<a class="ghost" href="mailto:'+esc(lead.email)+'?subject='+encodeURIComponent("Inquiry: "+(L.address||L.headline||"Listing"))+'">✉️ Email</a>':'')
      + '</div></div>';

    html += '</main>';
    document.getElementById("app").innerHTML = html;
  }

  /* ---- footer (static) ---- */
  var f = document.createElement("footer");
  f.innerHTML = '<div class="inner">'
    + '<div><b style="color:#e6ebef">Eshenbaugh Land Company</b><br>'+esc(COMPANY.address)+'</div>'
    + '<div><a href="'+telHref(COMPANY.phone)+'">'+COMPANY.phone+'</a> · <a href="'+COMPANY.websiteUrl+'" target="_blank" rel="noopener">'+COMPANY.website+'</a></div>'
    + '</div>'
    + '<div class="disc">All information is deemed reliable but is not guaranteed and should be independently verified. '
    + 'Property boundaries shown in photos or maps are approximate. Pricing, availability, and terms are subject to change '
    + 'or withdrawal without notice. Buyers should conduct their own due diligence. Licensed Real Estate Broker — Florida.</div>';
  document.body.appendChild(f);

  /* ---- load ---- */
  var id = decodeURIComponent((location.hash||"").replace(/^#/,"")).trim();
  if(!id){ showState("🏞️","No listing specified","This link is missing its listing id. Please use the exact link your advisor shared with you."); return; }

  Promise.all([
    import("https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js")
  ]).then(function(mods){
    var app = mods[0].initializeApp(FB_CONFIG);
    var db  = mods[1].getFirestore(app);
    return mods[1].getDoc(mods[1].doc(db,"listings",id));
  }).then(function(snap){
    if(!snap || !snap.exists()){ showState("🔍","Listing not found","This listing may have been removed, or the link may be incomplete. Double-check the link, or contact us and we'll point you to the right property."); return; }
    var L = snap.data();
    if(L.published===false){ showState("🚫","This listing is no longer available","It may be under contract or off the market. Contact us to learn about similar available properties."); return; }
    render(L);
  }).catch(function(e){
    console.error(e);
    showState("⚠️","Couldn't load this listing","Please check your connection and refresh the page. If the problem persists, contact us and we'll send the details directly.");
  });

  window.addEventListener("hashchange",function(){ location.reload(); });
})();
</script>
</body>
</html>
